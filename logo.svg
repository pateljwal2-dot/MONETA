<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Main 'M' Ribbon 1 (Left to Center) -->
    <linearGradient id="mRibbonLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Main 'M' Ribbon 2 (Center to Right Apex) -->
    <linearGradient id="mRibbonRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Emerald Coin Core Glow -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.06   0 0 0 0 0.72   0 0 0 0 0.5   0 0 0 0.6 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Canvas (iOS App Icon Shape) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="2" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#6366f1" opacity="0.14" filter="url(#subtleGlow)" />
  <circle cx="340" cy="180" r="100" fill="#a855f7" opacity="0.12" filter="url(#subtleGlow)" />

  <!-- Modern Architectural 'M' Geometry -->
  <g id="moneta-symbol">
    <!-- Left Pillar (Rise) -->
    <path d="M 124 374 L 124 196 C 124 168 148 148 174 158 L 256 242 L 180 374 Z" 
          fill="url(#mRibbonLeft)" opacity="0.9" />

    <!-- Center Fold Overlap -->
    <path d="M 174 158 L 256 244 L 338 158 C 364 148 388 168 388 196 L 388 374 L 332 374 L 332 232 L 256 312 L 180 232 L 180 374 Z" 
          fill="url(#mRibbonRight)" />

    <!-- Left Pillar Highlight -->
    <path d="M 124 374 L 124 196 C 124 168 148 148 174 158 L 180 164 L 180 374 Z" 
          fill="url(#mRibbonLeft)" />

    <!-- Right Pillar Forward Growth Accent (Dynamic Angle) -->
    <path d="M 332 232 L 388 174 L 388 374 L 332 374 Z" 
          fill="url(#mRibbonRight)" opacity="0.95" />

    <!-- Center Core: The Moneta Coin (Family Wealth Core) -->
    <circle cx="256" cy="182" r="26" fill="url(#emeraldGlow)" filter="url(#coinGlow)" />
    <!-- Inner Coin Rim -->
    <circle cx="256" cy="182" r="16" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.75" />
    <!-- Center Currency Dot -->
    <circle cx="256" cy="182" r="5" fill="#ffffff" />
  </g>
</svg>
