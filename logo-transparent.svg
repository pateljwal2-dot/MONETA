<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="transMLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="transMRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="transEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="transCoinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="moneta-mark">
    <!-- Left Pillar -->
    <path d="M 108 390 L 108 190 C 108 155 138 132 170 145 L 256 235 L 176 390 Z" 
          fill="url(#transMLeft)" />

    <!-- Center Bridge & Right Upward Arch -->
    <path d="M 170 145 L 256 238 L 342 145 C 374 132 404 155 404 190 L 404 390 L 342 390 L 342 228 L 256 312 L 170 228 L 170 390 Z" 
          fill="url(#transMRight)" />

    <!-- Outer Left Edge Soft Shade -->
    <path d="M 108 390 L 108 190 C 108 155 138 132 170 145 L 170 390 Z" 
          fill="url(#transMLeft)" opacity="0.95" />

    <!-- Center Core: Emerald Moneta Coin Disc -->
    <circle cx="256" cy="170" r="28" fill="url(#transEmerald)" filter="url(#transCoinGlow)" />
    <!-- Inner Coin Ring -->
    <circle cx="256" cy="170" r="18" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    <!-- Center Wealth Node -->
    <circle cx="256" cy="170" r="6" fill="#ffffff" />
  </g>
</svg>
